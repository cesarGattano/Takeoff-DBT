        description: "Quantité du produits en stock"
      - name: actif
        description: "Produit actif ?"

  - name: raw_commandes
    description: "Données commandes brutes"
    columns:
      - name: commande_id
        description: "Identifiant unique de commande"
      - name: client_id
        description: "Identifiant du client ayant passé la commande"
